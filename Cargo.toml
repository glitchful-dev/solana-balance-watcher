[package]
name = "solana-balance-watcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solana-balance-watcher"
path = "./src/bin/cli.rs"

[dependencies]
axum = "0.6.18"
anyhow = "1.0.40"
chrono = "0.4"
futures = "0.3.30"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4.14"
prometheus = "0.14"
solana-client = "4.4"
solana-pubkey = "4.3"
solana-native-token = "3"
solana-account-decoder-client-types = "4.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.37"
tracing-log = "0.1.3"
tracing-subscriber = { version = "0.3" }
once_cell = "1.19.0"
